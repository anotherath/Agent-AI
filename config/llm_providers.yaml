# Catalog LLM providers / credentials / models.
# Secrets: chỉ ghi tên biến env (api_key_env), không ghi key thật.
# Catalog id FE dùng: "<provider_id>:<model_id>" — ví dụ vibi:gpt-6-luna

default_model: vibi:gpt-6-luna

providers:
  vibi:
    label: Vibi
    base_url: https://vibi.top/v1
    credentials:
      - id: main
        api_key_env: OPENAI_API_KEY
        models:
          - id: gpt-6-luna
            label: GPT-6 Luna
          - id: gpt-6.1-terra
            label: GPT 6.1 Terra
          - id: gpt-6.1-sol
            label: GPT 6.1 Sol
      - id: deepseek
        api_key_env: DEEPSEEK_API_KEY
        models:
          - id: deepseek-v4-flash
            label: DeepSeek V4 Flash